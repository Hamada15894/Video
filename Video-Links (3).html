<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a1230">
<title>روابط فيديو المتاجر</title>
<style>
:root{--ink:#0c1330;--ink2:#5b6483;--line:#e4e7f0;--bg:#f3f5fa;--card:#fff;--brand:#0a1230;--accent:#2a5bea;--accent2:#e9effd;--ok:#0c8a5c;--okbg:#e5f6ef;--warn:#a85a07;--warnbg:#fdf3e4;--bad:#c22a31;--badbg:#fdeced}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.top{background:var(--brand);color:#fff}
.top-in{max-width:720px;margin:0 auto;padding:16px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2a5bea,#6d8dff);display:grid;place-items:center;flex:none}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1}
.gear{background:rgba(255,255,255,.1);border:0;color:#fff;width:38px;height:38px;border-radius:10px;cursor:pointer;display:grid;place-items:center}
.gear:hover{background:rgba(255,255,255,.18)}
main{max-width:720px;margin:0 auto;padding:22px 16px 60px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(12,19,48,.05),0 10px 30px rgba(12,19,48,.05);padding:22px}
h2{font-size:16px;margin:0 0 14px}
label.l{display:block;font-weight:700;font-size:13.5px;margin:0 0 8px}
input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fff;color:var(--ink);outline:none;transition:.15s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent2)}
#store{font-size:20px;font-weight:700;padding:15px 16px}
.preview{margin-top:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:20px}
.preview b{color:var(--accent);direction:ltr;font-weight:600}
.preview button{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:0}
#slugEdit{display:none;margin-top:8px;direction:ltr}
#slugEdit.on{display:flex}
#slugEdit span{background:#f1f3f8;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;padding:10px;color:var(--ink2);font-size:13px;white-space:nowrap}
#slugEdit input{border-radius:0 12px 12px 0;padding:10px 12px}
.drop{margin-top:18px;border:2px dashed #c8cfe0;border-radius:16px;padding:30px 16px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfe;position:relative}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent2)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop b{display:block;font-size:16px;margin-top:8px}
.drop small{color:var(--ink2)}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.clip{position:relative;border-radius:12px;overflow:hidden;background:#1b2340;aspect-ratio:3/4}
.clip img{width:100%;height:100%;object-fit:cover;display:block}
.clip .n{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.clip .d{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;direction:ltr}
.clip .x{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.clip.busy::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.clip.add{display:grid;place-items:center;background:#f3f5fa;border:2px dashed #c8cfe0;color:var(--ink2);cursor:pointer;font-size:12px;text-align:center}
.clip.add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mode{display:none;margin-top:18px;grid-template-columns:1fr 1fr;gap:10px}
.mode.on{display:grid}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s;background:#fff}
.opt:hover{border-color:#b9c6ef}
.opt input{display:none}
.opt .ic{width:36px;height:36px;border-radius:10px;background:#f1f3f8;display:grid;place-items:center;flex:none;color:var(--ink2)}
.opt b{display:block;font-size:14px}
.opt small{color:var(--ink2);font-size:12px;line-height:1.5;display:block}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent2)}
.opt:has(input:checked) .ic{background:var(--accent);color:#fff}
@media(max-width:520px){.mode{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:.15s;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.big{width:100%;padding:16px;font-size:16px;margin-top:18px;border-radius:14px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#f5f7fb;filter:none}
.btn.sm{padding:7px 12px;font-size:13px;font-weight:600;border-radius:9px}
.btn.wa{background:#1f9d55}
.btn.danger{background:#fff;color:var(--bad);border:1px solid #f1c8ca}
.alert{border-radius:12px;padding:10px 14px;font-size:13.5px;margin-top:14px;display:none}
.alert.on{display:block}.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.ok{background:var(--okbg);color:var(--ok)}
.prog{display:none;margin-top:18px}
.prog.on{display:block}
.prog .t{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin-bottom:8px}
.prog .t span:last-child{direction:ltr;color:var(--ink2)}
.bar{height:8px;background:#eaedf5;border-radius:99px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#6d8dff);transition:width .25s}
.res{display:none;margin-top:18px;border:1px solid #c3e6d6;background:var(--okbg);border-radius:16px;padding:16px}
.res.on{display:block}
.res .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.res .h b{font-size:16px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.badge.live{background:var(--ok);color:#fff}
.badge.wait{background:#fff;color:var(--warn);border:1px solid #f1d4aa}
.badge.wait::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:p 1s infinite}
@keyframes p{50%{opacity:.25}}
.lnk{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #cfe9dd;border-radius:12px;padding:8px 8px 8px 14px;direction:ltr;margin-bottom:8px}
.lnk a{flex:1;color:var(--accent);font-weight:700;word-break:break-all;text-decoration:none}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lib{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px}
.item img,.item .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#e8ebf3;flex:none}
.item .info{flex:1;min-width:0}
.item .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .info a{color:var(--accent);font-size:12.5px;direction:ltr;display:inline-block;text-decoration:none;word-break:break-all}
.item .info small{color:var(--ink2);display:block;font-size:12px}
.item .a{display:flex;gap:6px}
@media(max-width:560px){.item{flex-wrap:wrap}.item .a{width:100%}}
.libhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.libhead h2{margin:0;flex:1}
.libhead input{max-width:180px;padding:9px 12px}
.empty{color:var(--ink2);text-align:center;padding:18px;font-size:14px}
.quota{margin-top:14px;font-size:12px;color:var(--ink2)}.quota .bar{height:5px;margin-top:6px}
.setup ol{padding-inline-start:20px;margin:0 0 16px;color:var(--ink2);font-size:13.5px}
.setup ol li{margin-bottom:5px}
.setup code{background:#f1f3f8;padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block;color:var(--ink)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.hidden{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,18,48,.45);display:none;place-items:center;padding:16px;z-index:10}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%}
.modal .box p{margin:0 0 16px;color:var(--ink2);font-size:14px}
.modal .box .acts{display:grid;gap:8px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></div>
  <h1>روابط فيديو المتاجر</h1>
  <button class="gear" id="btnSettings" type="button" title="الإعدادات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main>
  <section class="card setup hidden" id="setupCard">
    <h2>الإعداد — مرة وحدة بس</h2>
    <ol>
      <li>افتح <code>github.com/settings/tokens/new</code></li>
      <li>Note: <code>video-links</code> · Expiration: <code>No expiration</code></li>
      <li>فعّل <code>repo</code> ← <b>Generate token</b> ← انسخ الكود</li>
    </ol>
    <div class="grid2">
      <div><label class="l">كود GitHub</label><input type="password" id="token" placeholder="ghp_..." autocomplete="off" dir="ltr"></div>
      <div><label class="l">المستودع</label><input type="text" id="repo" value="v" dir="ltr"></div>
    </div>
    <label class="l">اسم يظهر أسفل صفحة الفيديو (اختياري)</label>
    <input type="text" id="org" placeholder="Modern Trade – Northern Region">
    <button class="btn big" id="btnSetup" type="button">تفعيل</button>
    <div class="alert" id="setupMsg"></div>
  </section>

  <section class="card hidden" id="upCard">
    <label class="l" for="store">اسم المتجر</label>
    <input type="text" id="store" placeholder="Othaim 56" autocomplete="off">
    <div class="preview" id="preview"></div>
    <div id="slugEdit"><span id="basePrefix"></span><input type="text" id="slug"></div>

    <div class="drop" id="drop">
      <input type="file" id="file" accept="video/*" multiple>
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2a5bea" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3"/></svg>
      <b>أرفق الفيديوهات</b>
      <small>فيديو واحد أو أكثر · MP4</small>
    </div>
    <div class="clips hidden" id="clips"></div>

    <div class="mode" id="mode">
      <label class="opt"><input type="radio" name="mode" value="playlist" checked>
        <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h12M3 12h12M3 18h8"/><path d="M17 15l5 3-5 3z" fill="currentColor"/></svg></span>
        <span><b>رابط واحد متواصل</b><small>كل الفيديوهات في رابط واحد، وتشتغل ورا بعض</small></span></label>
      <label class="opt"><input type="radio" name="mode" value="single">
        <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span><b>رابط لكل فيديو</b><small>كل فيديو له رابطه الخاص</small></span></label>
    </div>

    <div class="alert" id="upMsg"></div>
    <button class="btn big" id="btnGo" type="button" disabled>إنشاء الرابط</button>

    <div class="prog" id="prog"><div class="t"><span id="progT">جاري الرفع…</span><span id="progP">0%</span></div><div class="bar"><div id="progBar"></div></div></div>
    <div class="res" id="res"></div>
  </section>

  <section class="card hidden" id="libCard">
    <div class="libhead"><h2>الروابط المحفوظة</h2><input type="text" id="q" placeholder="بحث…"></div>
    <div class="lib" id="lib"></div>
    <div class="quota"><span id="quotaTxt"></span><div class="bar"><div id="quotaBar"></div></div></div>
  </section>
</main>

<div class="modal" id="modal"><div class="box"><h2 id="mT"></h2><p id="mP"></p><div class="acts" id="mA"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const SELF_HTML = '<!doctype html>\n' + document.documentElement.outerHTML;
const $ = id => document.getElementById(id);
const MAX_MB = 75, SITE_LIMIT = 1024 ** 3;
const mem = {};
const LS = { get:(k,d='')=>{ try{ return localStorage.getItem('vl_'+k) ?? d }catch(e){ return mem[k] ?? d } }, set:(k,v)=>{ try{ localStorage.setItem('vl_'+k,v) }catch(e){ mem[k]=v } } };
let cfg = { token: LS.get('token'), repo: LS.get('repo','v'), owner: LS.get('owner'), org: LS.get('org') };
let manifest = { pages: [] };
let clips = []; // {file, poster, posterUrl, w, h, dur, ready}
let slugTouched = false, busy = false;

const base = () => `https://${cfg.owner.toLowerCase()}.github.io/${cfg.repo}/`;
const short = () => `${cfg.owner.toLowerCase()}.github.io/${cfg.repo}/`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LRI = s => '⁦' + s + '⁩';
const fmtMB = b => LRI((b/1048576).toFixed(b < 10485760 ? 1 : 0) + ' MB');
const fmtDur = s => !s || !isFinite(s) ? '' : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const mode = () => clips.length > 1 ? document.querySelector('input[name=mode]:checked').value : 'playlist';
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1800) }
function msg(id, t, k){ const e=$(id); e.className = t ? 'alert on '+k : 'alert'; e.textContent = t || '' }
async function copy(t){ try{ await navigator.clipboard.writeText(t) }catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove() } toast('تم النسخ ✓') }
function ask(title, text, buttons){
  return new Promise(res => {
    $('mT').textContent = title; $('mP').textContent = text;
    $('mA').innerHTML = buttons.map((b,i) => `<button class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('');
    $('modal').classList.add('on');
    $('mA').onclick = e => { const b = e.target.closest('button'); if (!b) return; $('modal').classList.remove('on'); res(buttons[b.dataset.i].value); };
  });
}

const AR = {'ا':'a','أ':'a','إ':'i','آ':'a','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'th','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ؤ':'o','ي':'y','ى':'a','ئ':'e','ء':''};
function slugify(s){
  return s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[؀-ۿ]/g, c => AR[c] ?? '')
    .toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}

/* ---------- GitHub ---------- */
const R = () => `/repos/${cfg.owner}/${cfg.repo}`;
async function gh(path, {method='GET', body}={}){
  const r = await fetch('https://api.github.com' + path, { method, cache:'no-store',
    headers:{ Authorization:'Bearer '+cfg.token, Accept:'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{}) },
    body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const j = await r.json().catch(() => null);
  if (!r.ok){ const e = new Error((j && j.message) || 'HTTP '+r.status); e.status = r.status; throw e; }
  return j;
}
function blobXHR(b64, onP){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('POST', 'https://api.github.com' + R() + '/git/blobs');
    x.setRequestHeader('Authorization','Bearer '+cfg.token); x.setRequestHeader('Accept','application/vnd.github+json'); x.setRequestHeader('Content-Type','application/json');
    x.upload.onprogress = e => e.lengthComputable && onP && onP(e.loaded/e.total);
    x.onload = () => { let j={}; try{ j=JSON.parse(x.responseText) }catch(e){} x.status<300 ? res(j.sha) : rej(Object.assign(new Error(j.message||'HTTP '+x.status),{status:x.status})) };
    x.onerror = () => rej(new Error('انقطع الاتصال أثناء الرفع'));
    x.send(JSON.stringify({ content:b64, encoding:'base64' }));
  });
}
const textBlob = async s => (await gh(R()+'/git/blobs', {method:'POST', body:{content:s, encoding:'utf-8'}})).sha;
const b64 = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1]); f.onerror = rej; f.readAsDataURL(blob); });
async function commit(entries, message){
  for (let a = 0; a < 3; a++){
    const ref = await gh(R()+'/git/ref/heads/main');
    const head = await gh(R()+'/git/commits/'+ref.object.sha);
    const tree = await gh(R()+'/git/trees', {method:'POST', body:{ base_tree:head.tree.sha, tree:entries.map(e => ({path:e.path, mode:'100644', type:'blob', sha:e.sha})) }});
    const c = await gh(R()+'/git/commits', {method:'POST', body:{ message, tree:tree.sha, parents:[ref.object.sha] }});
    try{ await gh(R()+'/git/refs/heads/main', {method:'PATCH', body:{ sha:c.sha }}); return; }
    catch(e){ if (e.status !== 422 || a === 2) throw e; await sleep(800); }
  }
}
async function loadManifest(){
  try{
    const f = await gh(R()+'/contents/videos.json?ref=main');
    const bytes = Uint8Array.from(atob(f.content.replace(/\n/g,'')), c => c.charCodeAt(0));
    manifest = JSON.parse(new TextDecoder().decode(bytes));
    if (!Array.isArray(manifest.pages)) manifest.pages = [];
  }catch(e){ if (e.status === 404) manifest = { pages: [] }; else throw e; }
}
const saveManifest = async () => ({ path:'videos.json', sha: await textBlob(JSON.stringify(manifest, null, 1)) });

/* ---------- Setup ---------- */
async function setup(){
  const btn = $('btnSetup');
  cfg.token = $('token').value.trim(); cfg.repo = ($('repo').value.trim() || 'v').replace(/[^A-Za-z0-9._-]/g,''); cfg.org = $('org').value.trim();
  if (!cfg.token) return msg('setupMsg','الصق كود GitHub','warn');
  btn.disabled = true; btn.textContent = 'جاري التفعيل…'; msg('setupMsg');
  try{
    cfg.owner = (await gh('/user')).login;
    let exists = true; try{ await gh(R()) }catch(e){ if (e.status === 404) exists = false; else throw e; }
    if (!exists){
      await gh('/user/repos', {method:'POST', body:{ name:cfg.repo, auto_init:true, description:'Store video links', homepage:base() }});
      for (let i = 0; i < 15; i++){ try{ await gh(R()+'/git/ref/heads/main'); break; }catch(e){ await sleep(1500); } }
    }
    await loadManifest();
    await commit([
      { path:'index.html', sha: await textBlob(SELF_HTML) },
      { path:'.nojekyll', sha: await textBlob('') },
      { path:'robots.txt', sha: await textBlob('User-agent: *\nDisallow: /\n') },
      await saveManifest()
    ], 'Setup');
    try{ await gh(R()+'/pages') }catch(e){ if (e.status !== 404) throw e;
      try{ await gh(R()+'/pages', {method:'POST', body:{ source:{ branch:'main', path:'/' } }}) }catch(e2){ if (e2.status !== 409) throw e2; } }
    ['token','repo','owner','org'].forEach(k => LS.set(k, cfg[k]));
    showApp(); toast('تم التفعيل ✓');
  }catch(e){
    msg('setupMsg', e.status === 401 ? 'الكود غير صحيح أو منتهي' : (e.status === 403 || e.status === 404) ? 'الكود ما عنده صلاحية repo' : 'خطأ: ' + e.message, 'bad');
  }finally{ btn.disabled = false; btn.textContent = 'تفعيل'; }
}

/* ---------- Clips ---------- */
function analyze(file){
  return new Promise(res => {
    const v = document.createElement('video'), url = URL.createObjectURL(file), out = { w:0, h:0, dur:0, poster:null, ok:false };
    let done = false; const fin = () => { if (done) return; done = true; URL.revokeObjectURL(url); res(out); };
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    v.onloadedmetadata = () => { out.w = v.videoWidth; out.h = v.videoHeight; out.dur = v.duration; out.ok = out.w > 0; v.currentTime = Math.min(1.2, (v.duration||2)/3); };
    v.onseeked = () => { try{
      const s = Math.min(1, 720/Math.max(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
      c.width = Math.round(v.videoWidth*s); c.height = Math.round(v.videoHeight*s); c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      c.toBlob(b => { out.poster = b; fin(); }, 'image/jpeg', .82);
    }catch(e){ fin(); } };
    v.onerror = fin; setTimeout(fin, 12000);
  });
}
async function addFiles(list){
  if (busy) return;
  msg('upMsg');
  const files = [...list].filter(f => /^video\//.test(f.type) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name));
  const big = files.filter(f => f.size > MAX_MB*1048576);
  if (big.length) msg('upMsg', `تم تجاهل ${big.length} فيديو أكبر من ${MAX_MB} ميجا. أرسله لنفسك في الواتساب وحمّله من هناك عشان يصغر حجمه.`, 'warn');
  const fresh = files.filter(f => f.size <= MAX_MB*1048576).map(file => ({ file, ready:false }));
  clips.push(...fresh); renderClips();
  for (const c of fresh){ Object.assign(c, await analyze(c.file), { ready:true }); if (c.poster) c.posterUrl = URL.createObjectURL(c.poster); renderClips(); }
  const bad = clips.filter(c => c.ready && (!c.ok || !/mp4|m4v/i.test(c.file.type + c.file.name)));
  if (bad.length && !big.length) msg('upMsg', 'تنبيه: فيه فيديو مو MP4 (مثلاً من كاميرا الآيفون)، ويمكن ما يشتغل على بعض أجهزة ويندوز. الأضمن ترسله في الواتساب وتحمّله من هناك.', 'warn');
}
function renderClips(){
  const el = $('clips');
  $('drop').classList.toggle('hidden', clips.length > 0); el.classList.toggle('hidden', !clips.length);
  el.innerHTML = clips.map((c,i) => `<div class="clip ${c.ready?'':'busy'}">${c.posterUrl ? `<img src="${c.posterUrl}" alt="">` : ''}<span class="n">${i+1}</span>${c.dur ? `<span class="d">${fmtDur(c.dur)}</span>` : ''}${busy ? '' : `<button class="x" data-i="${i}" type="button" title="حذف">×</button>`}</div>`).join('')
    + (busy ? '' : `<label class="clip add"><input type="file" accept="video/*" multiple><span>＋<br>إضافة</span></label>`);
  $('mode').classList.toggle('on', clips.length > 1);
  validate();
}
function validate(){

  $('btnGo').disabled = busy || !s || !clips.length || clips.some(c => !c.ready) || !/^[a-z0-9][a-z0-9-]*$/.test(slug);

}

/* ---------- Upload ---------- */
function prog(p, t){ $('progBar').style.width = Math.round(p*100)+'%'; $('progP').textContent = Math.round(p*100)+'%'; if (t) $('progT').textContent = t; }
function lockUI(on){ busy = on; ['store','slug'].forEach(i => $(i).disabled = on); document.querySelectorAll('input[name=mode]').forEach(r => r.disabled = on); renderClips(); }

async function go(){
  const name = $('store').value.trim(), slug = $('slug').value.trim(), m = mode();
  msg('upMsg'); $('res').classList.remove('on');
  try{ await loadManifest(); }catch(e){ return msg('upMsg', e.status === 401 ? 'كود GitHub انتهى — حدّثه من الإعدادات' : 'خطأ: '+e.message, 'bad'); }

  // decide targets
  let targets = []; // {slug, name, clips:[clip objects], existing, append}
  if (m === 'playlist'){
    const ex = manifest.pages.find(p => p.slug === slug);
    let append = false;
    if (ex){
      const r = await ask('الرابط موجود', `«${ex.name}» عنده ${ex.clips.length} فيديو على نفس الرابط. وش تبي تسوي؟`, [
        { label:'إضافة الفيديوهات الجديدة له', value:'add' }, { label:'استبدال القديم بالجديد', value:'replace', cls:'ghost' }, { label:'إلغاء', value:null, cls:'ghost' } ]);
      if (!r) return; append = r === 'add';
    }
    targets.push({ slug, name, clips, existing: ex, append });
  } else {
    let n = 1;
    for (const c of clips){
      while (manifest.pages.some(p => p.slug === `${slug}-${n}`)) n++;
      targets.push({ slug: `${slug}-${n}`, name: `${name} — ${n}`, clips:[c] }); n++;
    }
  }

  lockUI(true); $('prog').classList.add('on'); prog(0, 'جاري الرفع…');
  const totalBytes = clips.reduce((a,c) => a + c.file.size, 0); let doneBytes = 0;
  try{
    const entries = [], made = [];
    let k = 0;
    for (const t of targets){
      const old = t.existing;
      const keep = t.append && old ? old.clips : [];
      let idx = keep.reduce((a,c) => Math.max(a, parseInt(c.f) || 0), 0);
      const newClips = [];
      for (const c of t.clips){
        k++; idx++;
        prog(doneBytes/totalBytes*.9, clips.length > 1 ? `جاري رفع الفيديو ${k} من ${clips.length}…` : 'جاري رفع الفيديو…');
        const sha = await blobXHR(await b64(c.file), p => prog((doneBytes + p*c.file.size)/totalBytes*.9));
        doneBytes += c.file.size;
        entries.push({ path:`${t.slug}/${idx}.mp4`, sha });
        const rec = { f:`${idx}.mp4`, size:c.file.size, w:c.w, h:c.h, dur:Math.round(c.dur||0) };
        if (c.poster){ entries.push({ path:`${t.slug}/${idx}.jpg`, sha: await blobXHR(await b64(c.poster)) }); rec.p = `${idx}.jpg`; }
        newClips.push(rec);
      }
      if (old && !t.append){ // remove leftover files from the replaced page
        const used = new Set(newClips.flatMap(c => [c.f, c.p]));
        old.clips.flatMap(c => [c.f, c.p]).filter(f => f && !used.has(f)).forEach(f => entries.push({ path:`${t.slug}/${f}`, sha:null }));
      }
      const page = { slug:t.slug, name:t.name, org:cfg.org, date:new Date().toISOString(), ver:Date.now().toString(36), clips:[...keep, ...newClips] };
      entries.push({ path:`${t.slug}/index.html`, sha: await textBlob(pageHTML(page)) });
      manifest.pages = [page, ...manifest.pages.filter(p => p.slug !== t.slug)];
      made.push(page);
    }
    prog(.93, 'جاري إنشاء الصفحة…');
    entries.push(await saveManifest());
    await commit(entries, `Videos: ${name}`);
    prog(1, 'تم ✓'); setTimeout(() => $('prog').classList.remove('on'), 800);
    showResult(made); renderLib();
    clips = []; slugTouched = false;
    lockUI(false); $('store').value = ''; $('slug').value = ''; renderClips();
    const ok = await Promise.all(made.map(p => waitLive(p))); setBadge(ok.every(Boolean));
  }catch(e){
    msg('upMsg', 'ما تم الرفع: ' + (e.status === 401 ? 'كود GitHub انتهى — حدّثه من الإعدادات' : e.message), 'bad');
    $('prog').classList.remove('on'); lockUI(false);
  }
}
async function waitLive(p){
  const u = base() + p.slug + '/', end = Date.now() + 6*60e3;
  while (Date.now() < end){
    try{ const r = await fetch(u + '?t=' + Date.now(), { cache:'no-store' }); if (r.ok && (await r.text()).includes(p.ver)) return true; }catch(e){}
    await sleep(5000);
  }
  return false;
}

async function libAction(e){

    await loadManifest();
    const cur = manifest.pages.find(x => x.slug === p.slug) || p;
    const entries = ['index.html', ...cur.clips.flatMap(c => [c.f, c.p]).filter(Boolean)].map(f => ({ path:`${p.slug}/${f}`, sha:null }));
    manifest.pages = manifest.pages.filter(x => x.slug !== p.slug);
    entries.push(await saveManifest());
    await commit(entries, `Delete ${p.slug}`);
    renderLib(); toast('تم الحذف');
  }catch(err){ toast('ما تم الحذف: ' + err.message); b.disabled = false; b.textContent = 'حذف'; }
}

/* ---------- Boot ---------- */
async function showApp(){
  $('setupCard').classList.add('hidden'); $('upCard').classList.remove('hidden'); $('libCard').classList.remove('hidden');
  $('basePrefix').textContent = short();
  validate(); renderLib();
  try{ await loadManifest(); renderLib(); }catch(e){ if (e.status === 401) msg('upMsg','كود GitHub انتهى — حدّثه من الإعدادات','bad'); }
  $('store').focus();
}
$('btnSetup').onclick = setup;
$('btnSettings').onclick = () => { $('token').value = cfg.token||''; $('repo').value = cfg.repo||'v'; $('org').value = cfg.org||''; $('setupCard').classList.toggle('hidden'); $('btnSetup').textContent = cfg.owner ? 'حفظ' : 'تفعيل'; };
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
$('clips').addEventListener('change', e => { if (e.target.type === 'file'){ addFiles(e.target.files); } });
$('clips').addEventListener('click', e => { const x = e.target.closest('.x'); if (x && !busy){ clips.splice(+x.dataset.i, 1); renderClips(); } });
['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); if (t === 'drop' && e.dataTransfer?.files?.length && cfg.owner) addFiles(e.dataTransfer.files); }));
$('store').oninput = () => { if (!slugTouched) $('slug').value = slugify($('store').value); validate(); };
$('slug').oninput = () => { slugTouched = true; $('slug').value = $('slug').value.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-{2,}/g,'-'); validate(); };
$('preview').addEventListener('click', e => { if (e.target.id === 'editSlug'){ $('slugEdit').classList.toggle('on'); $('slug').focus(); } });
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = validate);
$('btnGo').onclick = go;
$('res').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b) copy(b.dataset.c); });
$('q').oninput = renderLib;
$('lib').onclick = libAction;
if (cfg.token && cfg.owner) showApp(); else $('setupCard').classList.remove('hidden');
</script>
</body>
